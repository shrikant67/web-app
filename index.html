<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reporting App</title>

  <!-- Simple reset + minimal layout -->
  <link rel="stylesheet" href="assets/styles.css">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-name">Reporting App</div>
    <div class="user-area" id="user-area">
      <!-- Filled by JS: login form or user info + logout -->
    </div>
  </header>

  <main class="container">
    <!-- Navigation (hidden until login) -->
    <nav id="nav" class="nav hidden">
      <button data-tab="dashboard" class="tab-btn active">Dashboard</button>
      <button data-tab="reports" class="tab-btn">Reports</button>
      <button data-tab="products" class="tab-btn">Products</button>
    </nav>

    <!-- Views -->
    <section id="views" class="views">
      <!-- Login / welcome -->
      <div id="view-login" class="view">
        <h2>Sign in</h2>
        <form id="login-form" class="login-form">
          <input id="username" placeholder="Username" required />
          <input id="password" placeholder="Password" type="password" required />
          <button type="submit">Login</button>
        </form>
        <p class="hint">Demo credentials: any non-empty username/password</p>
      </div>

      <!-- Dashboard -->
      <div id="view-dashboard" class="view hidden">
        <h2>Dashboard</h2>
        <div class="charts">
          <div class="chart-card">
            <h3>Sales by Product (pie)</h3>
            <canvas id="pieChart" width="400" height="300"></canvas>
          </div>
          <div class="chart-card">
            <h3>Sales Over Time (line)</h3>
            <canvas id="lineChart" width="600" height="300"></canvas>
          </div>
        </div>
      </div>

      <!-- Reports -->
      <div id="view-reports" class="view hidden">
        <h2>Reports</h2>
        <div class="search-row">
          <input id="report-search" placeholder="Search product name..." />
          <button id="report-search-btn">Search</button>
        </div>
        <div id="report-results">
          <table class="table" id="report-table">
            <thead><tr><th>Product</th><th>Total Sales</th></tr></thead>
            <tbody></tbody>
          </table>
          <div class="pagination" id="report-pagination"></div>
        </div>
      </div>

      <!-- Products -->
      <div id="view-products" class="view hidden">
        <h2>Products</h2>
        <div class="products-controls">
          <button id="btn-add-product">Add Product</button>
        </div>
        <table class="table" id="products-table">
          <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="pagination" id="products-pagination"></div>
      </div>
    </section>
  </main>

  <!-- Modal (Add / Edit product) -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">Add Product</h3>
      <form id="product-form">
        <input id="product-name" placeholder="Product name" required />
        <input id="product-price" placeholder="Price" type="number" min="0" step="0.01" required />
        <div class="modal-actions">
          <button type="submit">Save</button>
          <button type="button" id="modal-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
